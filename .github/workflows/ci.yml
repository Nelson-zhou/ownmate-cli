name: CLI checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ownmate-core
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux keyring build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p ownmate-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: ownmate-mcp-${{ matrix.os }}
          path: |
            ownmate-core/target/release/ownmate-mcp
            ownmate-core/target/release/ownmate-mcp.exe

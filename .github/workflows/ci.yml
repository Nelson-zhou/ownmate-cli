name: CLI checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ownmate-core
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux keyring build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p ownmate-mcp --target ${{ matrix.target }}
      - name: Package CLI and checksum
        working-directory: .
        shell: python
        env:
          CLI_TARGET: ${{ matrix.target }}
        run: |
          import hashlib, os, pathlib, subprocess, tarfile, zipfile
          root = pathlib.Path.cwd()
          target = os.environ["CLI_TARGET"]
          windows = "windows" in target
          executable = "ownmate-mcp.exe" if windows else "ownmate-mcp"
          binary = root / "ownmate-core" / "target" / target / "release" / executable
          version = subprocess.check_output([str(binary), "--version"], text=True).strip().split()[1]
          dist = root / "dist"
          dist.mkdir()
          archive = dist / (f"ownmate-mcp-v{version}-{target}" + (".zip" if windows else ".tar.gz"))
          files = [(binary, executable)] + [(root / name, name) for name in ("README.md", "LICENSE", "NOTICE", "SECURITY.md", "THIRD_PARTY_NOTICES.md")]
          if windows:
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as package:
                  for source, name in files:
                      package.write(source, name)
          else:
              with tarfile.open(archive, "w:gz") as package:
                  for source, name in files:
                      package.add(source, arcname=name)
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_name(archive.name + ".sha256").write_text(f"{checksum}  {archive.name}\n", encoding="ascii")
      - uses: actions/upload-artifact@v4
        with:
          name: ownmate-mcp-${{ matrix.target }}
          if-no-files-found: error
          path: dist/*

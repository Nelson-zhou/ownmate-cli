[workspace]
resolver = "2"
members = ["crates/mcp-cli", "crates/journal-domain", "crates/document-model", "crates/document-validation", "crates/asset-manifest", "crates/canonical-json"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[package]
name = "ownmate-mcp"
version = "0.2.2"
rust-version = "1.89"
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
hkdf = "0.12.4"
journal-domain = { path = "../journal-domain" }
p256 = { version = "0.13.2", features = ["ecdh", "pkcs8"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "json"] }
zeroize = { version = "1.8.1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent"] }

[dev-dependencies]
hex-literal = "1.0.0"
